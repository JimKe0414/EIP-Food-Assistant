name: verify

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Ensure API key names are absent from the client bundle
        run: '! grep -R -E "GOOGLE_GENAI_API_KEY|OPENAI_COMPAT_API_KEY" .output/public'
      - name: Validate Compose models
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.cloud.yml config --quiet
          docker compose -f compose.yml -f compose.gpu.yml config --quiet
