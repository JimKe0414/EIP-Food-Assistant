services:
  web:
    environment:
      NUXT_PUBLIC_AI_PROCESSING_MODE: cloud

  worker:
    environment:
      AI_EGRESS_MODE: cloud-approved
      AI_TEXT_PROVIDER: openai-compatible
      AI_VISION_PROVIDER: openai-compatible
      AI_AUDIO_PROVIDER: openai-compatible
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-https://api.focusit.tw/openai/v1}
      OPENAI_COMPAT_TEXT_MODEL: ${OPENAI_COMPAT_TEXT_MODEL:-Qwen3.6-35B-A3B-fast}
      OPENAI_COMPAT_MAX_TOKENS: ${OPENAI_COMPAT_MAX_TOKENS:-4096}
      # api.focusit.tw 的 key 只被授權存取 Qwen3.6-35B-A3B-{fast,thinking}，這兩個 model group
      # 在 /audio/transcriptions 上是 404 — 該 gateway 沒有掛轉錄後端。語音因此獨立指向
      # Azure AI Foundry，key 走 openai_compat_audio_api_key secret。
      #
      # 注意這裡走的是 Azure 傳統的部署路徑，不是 /openai/v1。實測該 resource 的 v1 相容介面
      # 解不到 whisper 部署（一律回 DeploymentNotFound），而 /openai/deployments/<部署名>/ 可以，
      # 且 ?api-version= 是必要的，省略會回 404 Resource not found。部署名稱在路徑裡。
      OPENAI_COMPAT_AUDIO_BASE_URL: ${OPENAI_COMPAT_AUDIO_BASE_URL:-https://jimke-foundry.services.ai.azure.com/openai/deployments/whisper?api-version=2024-06-01}
      # 走 Azure 部署路徑時這個欄位會被忽略（部署已在 URL 裡），但仍要填 — 對一般 OpenAI 相容
      # 端點來說 model 是必要參數，留空會被擋下來。
      OPENAI_COMPAT_AUDIO_MODEL: ${OPENAI_COMPAT_AUDIO_MODEL:-whisper}
    secrets:
      - openai_compat_api_key
      - openai_compat_audio_api_key

secrets:
  openai_compat_api_key:
    file: ./secrets/openai_compat_api_key.txt
  openai_compat_audio_api_key:
    file: ./secrets/openai_compat_audio_api_key.txt
